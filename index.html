<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gelände-Navi Winterhafen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: Ein-Bildschirm-App. Kopfleiste · Karte (füllt) · Tafel unten. Wegweiser-Optik, Lageplan nach CAD, Norden zeigt nach links. */
:root{
  --bg:#eef0f1; --panel:#ffffff; --ink:#1d2327; --muted:#5d686f; --line:#d5dadd;
  --route:#e4572e; --route-ink:#ffffff; --you:#1a6fd6; --ok:#1f8a4c; --warn:#b26a00; --stand:#d7261e;
  --chip:#f3f5f6; --shadow:0 -6px 24px rgba(20,30,40,.12);
  --m-ground:#eceae4; --m-road:#f5f5f2; --m-road-edge:#d3d5d8; --m-lane:#ffffff; --m-lane-edge:#9ea7ae; --m-water:#b7d6ea; --m-water-ink:#5b8fb0;
  --m-oeswag:#a9d6e2; --m-hallen:#ece0a6; --m-mieter:#b6dbb2; --m-sonst:#efc39c; --m-lager:#f3e9d0; --m-bldg-line:#8d979f;
  --m-label:#2a3136; --m-num:#3b464d;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14191c; --panel:#1d2428; --ink:#e9edef; --muted:#9aa6ad; --line:#323c42;
  --route:#ff6b3d; --route-ink:#14191c; --you:#5aa2ff; --ok:#4cc27e; --warn:#f0a63a; --stand:#ff5a4f;
  --chip:#262f34; --shadow:0 -6px 24px rgba(0,0,0,.45);
  --m-ground:#1c2225; --m-road:#2c353a; --m-road-edge:#242b2f; --m-lane:#55616a; --m-lane-edge:#161b1e; --m-water:#1b3a4e; --m-water-ink:#6fa3c4;
  --m-oeswag:#2c5560; --m-hallen:#5a5232; --m-mieter:#2f5133; --m-sonst:#5e4330; --m-lager:#3a3629; --m-bldg-line:#6a767e;
  --m-label:#e9edef; --m-num:#c9d2d7; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14191c; --panel:#1d2428; --ink:#e9edef; --muted:#9aa6ad; --line:#323c42;
  --route:#ff6b3d; --route-ink:#14191c; --you:#5aa2ff; --ok:#4cc27e; --warn:#f0a63a; --stand:#ff5a4f;
  --chip:#262f34; --shadow:0 -6px 24px rgba(0,0,0,.45);
  --m-ground:#1c2225; --m-road:#2c353a; --m-road-edge:#242b2f; --m-lane:#55616a; --m-lane-edge:#161b1e; --m-water:#1b3a4e; --m-water-ink:#6fa3c4;
  --m-oeswag:#2c5560; --m-hallen:#5a5232; --m-mieter:#2f5133; --m-sonst:#5e4330; --m-lager:#3a3629; --m-bldg-line:#6a767e;
  --m-label:#e9edef; --m-num:#c9d2d7; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;overflow:hidden}
#app{height:100%;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr)}
header{display:flex;align-items:center;gap:10px;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header h1{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.02em;margin:0;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
@media (max-width:520px){header .sub{display:none} .langbtn{margin-left:auto}}
.routehead .names b,.item span{overflow-wrap:anywhere}
header .sub{color:var(--muted);font-size:13px;margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.langbtn{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:8px;padding:5px 8px;font:600 13px var(--f-body);cursor:pointer}
.flag{display:inline-block;width:24px;height:16px;border-radius:2px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.18);flex:none}
.flag svg{width:100%;height:100%;display:block}
.langmenu{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 54px);z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,.2);padding:6px;display:grid;grid-template-columns:1fr 1fr;gap:4px;width:min(320px,calc(100% - 20px))}
.langmenu button{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--ink);border-radius:8px;padding:10px;font:500 15px var(--f-body);cursor:pointer;text-align:left}
.langmenu button:hover,.langmenu button[aria-current="true"]{background:var(--chip)}
.langmenu button[aria-current="true"]{font-weight:700}
#map{position:relative;overflow:hidden;touch-action:none;background:var(--m-ground);cursor:grab}
#map:active{cursor:grabbing}
#map > svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.bnum text{fill:var(--m-num);font:600 7px var(--f-body);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.lbl-water{fill:var(--m-water-ink);font-family:var(--f-display);font-weight:600;font-style:italic;letter-spacing:.25em;text-transform:uppercase}
.lbl-road{fill:var(--muted);font-family:var(--f-body);font-weight:600;letter-spacing:.06em}
.pinlbl{fill:var(--m-label);stroke:var(--m-ground);stroke-width:3.5;paint-order:stroke;font:600 11px var(--f-body)}
.ctrls{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:10px;display:flex;flex-direction:column;gap:8px}
.ctrls button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  font:600 20px/1 var(--f-display);box-shadow:0 2px 8px rgba(0,0,0,.15);cursor:pointer;display:grid;place-items:center}
.ctrls button svg{width:22px;height:22px}
.north{position:absolute;left:max(10px,env(safe-area-inset-left,0px));bottom:10px;width:40px;height:40px;border-radius:50%;background:var(--panel);
  border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.north svg{width:30px;height:30px}
.gps-pill{position:absolute;left:max(10px,env(safe-area-inset-left,0px));top:10px;max-width:calc(100% - 80px);background:var(--panel);
  border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 10px;font-size:13px;display:flex;gap:8px;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.gps-pill .dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.gps-pill.live .dot{background:var(--you);box-shadow:0 0 0 4px color-mix(in srgb,var(--you) 25%,transparent)}
.gps-pill.warn .dot{background:var(--warn)}
#panel{background:var(--panel);box-shadow:var(--shadow);border-radius:16px 16px 0 0;max-height:46vh;overflow:auto;
  padding-top:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font:600 12px/1 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px}
.eyebrow:first-child{margin-top:0}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--chip);color:var(--ink);
  text-align:left;font:600 17px/1.15 var(--f-body);cursor:pointer;min-height:64px}
.big.primary{background:var(--route);border-color:var(--route);color:var(--route-ink)}
.big small{display:block;font-weight:500;font-size:13px;opacity:.85;margin-top:2px}
.big.primary .badge{background:var(--route-ink);color:var(--route)}
.search{width:100%;font:500 16px var(--f-body);padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-top:12px}
.list{display:grid;gap:2px}
.item{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:8px;border:0;border-radius:10px;
  background:transparent;color:var(--ink);font:500 15px/1.25 var(--f-body);cursor:pointer}
.item:hover{background:var(--chip)}
.item small{display:block;color:var(--muted);font-size:13px}
.item .m{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.badge{flex:none;width:38px;height:38px;border-radius:8px;display:grid;place-items:center;background:var(--ink);color:var(--panel);
  font:700 18px/1 var(--f-display)}
.badge.sm{font-size:15px}
.badge.park{background:#1f56c6;color:#fff}
.badge.stand{background:var(--stand);color:#fff;border-radius:50%}
.badge.dest{background:var(--route);color:var(--route-ink)}
.startline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-top:10px}
.startline b{color:var(--ink)}
.routehead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.routehead .arrow{color:var(--muted);font:600 20px var(--f-display)}
.routehead .names{min-width:0;flex:1 1 200px}
.routehead .names b{font:700 22px/1.1 var(--f-display);letter-spacing:.01em;display:block}
.routehead .names span{color:var(--muted);font-size:14px}
.status{margin:12px 0 4px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.status .bignum{font:700 30px/1 var(--f-display);font-variant-numeric:tabular-nums}
.status .note{color:var(--muted);font-size:14px}
ol.steps{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:2px}
ol.steps li button{width:100%;display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;text-align:left;padding:9px 8px;
  border:0;border-radius:10px;background:transparent;color:var(--ink);font:400 15px/1.3 var(--f-body);cursor:pointer}
ol.steps li button:hover,ol.steps li.on button{background:var(--chip)}
ol.steps li.done button{color:var(--muted)}
ol.steps .ico{width:30px;height:30px;border-radius:8px;background:var(--chip);display:grid;place-items:center;color:var(--ink)}
ol.steps li.on .ico{background:var(--route);color:var(--route-ink)}
ol.steps .ico svg{width:18px;height:18px}
ol.steps .m{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:10px;padding:10px 14px;font:600 15px var(--f-body);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--route);border-color:var(--route);color:var(--route-ink)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--you);outline-offset:2px}
#arrived{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--ok);color:#fff;border-radius:16px;padding:18px 22px;
  text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25);width:min(320px,calc(100% - 40px))}
#arrived b{display:block;font:700 26px/1.1 var(--f-display);margin-bottom:4px}
.page{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:20;
  padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page .inner{max-width:880px;margin:0 auto;display:grid;gap:16px}
.page h2{font:700 28px/1.1 var(--f-display);margin:0;text-transform:uppercase;letter-spacing:.02em}
.page p{margin:0;max-width:65ch;color:var(--muted)}
.signs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.sign{background:#fff;color:#111;border:2px solid #111;border-radius:14px;padding:16px;display:grid;gap:10px;justify-items:center;text-align:center;break-inside:avoid}
.sign .t{font:700 22px/1.1 var(--f-display);text-transform:uppercase}
.sign .q{width:190px;height:190px}
.sign .q svg{width:100%;height:100%}
.sign small{font-size:12px;color:#444;word-break:break-all}
.field{display:grid;gap:6px}
.field label{font-size:13px;color:var(--muted)}
.field input{font:500 15px var(--f-body);padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);width:100%}
@media print{body{overflow:visible} #app{display:none} .page{position:static;padding:0} .noprint{display:none!important} .signs{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@keyframes flow{to{stroke-dashoffset:-40}}
.flow{animation:flow 1.2s linear infinite}
@keyframes pulse{0%{r:6;opacity:.55}100%{r:20;opacity:0}}
.pulse{animation:pulse 1.8s ease-out infinite}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} body{margin:0} [hidden]{display:none!important}</style>
</head>

const smoothD = (pts, R=10) => { let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for (let i=1;i<pts.length-1;i++){ const [a,b,c] = [pts[i-1],pts[i],pts[i+1]];
    const l1 = Math.hypot(a[0]-b[0],a[1]-b[1]), l2 = Math.hypot(c[0]-b[0],c[1]-b[1]); const r = Math.min(R, l1/2, l2/2);

function buildSteps(r, from, to){

  steps.push({icon:'start', text:t('startStep', {x:esc(nm(from)), dir:compass(bearing(P[1][0]-P[0][0], P[1][1]-P[0][1]))}), i0:0, i1:1});
  for (let i=1;i<P.length-1;i++){
    const a = P[i-1], b = P[i], c = P[i+1]; const v1 = [b[0]-a[0], b[1]-a[1]], v2 = [c[0]-b[0], c[1]-b[1]];

    else if (ang < 135) icon = right?'right':'left';
    else icon = right?'uright':'uleft';

    steps.push({icon, text:t('turnStep', {turn:word, dir:compass(bearing(v2[0], v2[1]))}), i0:i, i1:i+1});
  }
  if (r.lastConn > 20) steps.push({icon:'goal', text:t('offNet', {d:fmtM(r.lastConn)}), i0:P.length-1, i1:P.length-1});
  if (noteOf(to)) steps.push({icon:'uleft', text:`<b>${esc(noteOf(to))}</b>`, i0:P.length-1, i1:P.length-1});
  steps.push({icon:'goal', text:t('goalStep', {x:esc(nm(to))}) + (subOf(D[to]) ? ' · ' + esc(subOf(D[to])) : ''), i0:P.length-1, i1:P.length-1});
  return steps;
}

    <div class="hero">
      <button class="big primary" data-to="${PRIMARY}">${badge(D[PRIMARY])}<span>${t('toGoods')}<small>${fmtM(dist[PRIMARY])}</small></span></button>
      <button class="big" data-to="${HOME}" ${st===HOME?'disabled style="opacity:.55"':''}>${badge(D[HOME])}<span>${t('toExit')}<small>${st===HOME?t('youHere'):fmtM(dist[HOME])}</small></span></button>
    </div>
    <div class="startline">${t('start')} <b>${st==='gps'?t('myPos'):esc(nm(st))}</b>${fixedStart?` <a class="btn" style="padding:4px 10px" href="#">${t('change')}</a>`:''}</div>
    <input class="search" id="q" type="search" placeholder="${esc(t('search'))}" aria-label="${esc(t('search'))}" autocomplete="off">
    <div id="lists">${groups.map(([t, arr]) => `<div class="grp"><p class="eyebrow">${t}</p><div class="list">${arr.map(item).join('')}</div></div>`).join('')}</div>`;
  panel.querySelectorAll('[data-to]').forEach(b => b.onclick = () => go(`${startId()}-${b.dataset.to}`));
  $('#q').oninput = e => { const q = e.target.value.trim().toLowerCase();
    panel.querySelectorAll('.list .item').forEach(b => { const d = D[b.dataset.to]; b.hidden = q && !(`${Object.values(I18N.names[d.id]||{}).join(' ')} ${d.name} ${subOf(d)} ${d.mark} ${d.firm||''}`.toLowerCase().includes(q)); });
    panel.querySelectorAll('.grp').forEach(g => g.hidden = ![...g.querySelectorAll('.item')].some(b => !b.hidden)); };
  requestAnimationFrame(fitSite);
}
let routeFrom = null;
function routeView(from, to, keepView){
  const fp = from==='gps' ? lastRaw : D[from].p;
  const r = computeRoute(fp, D[to].p, from==='gps' ? null : from, to);
  current = Object.assign(r, {from, to}); current.steps = buildSteps(r, from, to); routeFrom = from;
  drawRoute(); drawPins(from==='gps'?null:from, to);
  $('#hsub').textContent = `→ ${to===HOME?exitName():nm(to)}`;
  panel.innerHTML = `
    <div class="routehead">${from==='gps' ? '<span class="badge" style="background:var(--you);color:#fff">●</span>' : badge(D[from])}<span class="arrow">→</span>${badge(D[to],'dest')}
      <div class="names"><b>${esc(to===HOME?exitName():nm(to))}</b><span>${esc([subOf(D[to]), t('from', {x:nm(from)})].filter(Boolean).join(' · '))}</span></div></div>
    <div class="status"><span class="bignum" id="remain">${fmtM(r.total/PXM)}</span><span class="note" id="note">${t('follow')}</span></div>
    <ol class="steps">${current.steps.map((s,i) => `<li data-i="${i}"><button><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${ICONS[s.icon]}</svg></span><span>${s.text}</span><span class="m">${s.i1>s.i0 ? fmtM((r.scum[s.i1]-r.scum[s.i0])/PXM) : ''}</span></button></li>`).join('')}</ol>
    <div class="row">${to!==HOME ? `<a class="btn primary" href="#${to}-${HOME}">${t('backExit')}</a>` : ''}<a class="btn" href="#${fixedStart?'von-'+fixedStart:''}">${t('otherDest')}</a></div>`;
  panel.querySelectorAll('ol.steps li').forEach(li => li.querySelector('button').onclick = () => focusStep(+li.dataset.i));
  $('#arrived').hidden = true; arrivedShown = false;
  if (!keepView){ follow = gpsOnSite; requestAnimationFrame(fitRoute); }
  startGPS();
  if (lastPos && !keepView) setTimeout(() => onPos(lastPos), 0);
}
function focusStep(i){ const s = current.steps[i]; const seg = current.spts.slice(s.i0, Math.max(s.i0+1, s.i1)+1);
  panel.querySelectorAll('ol.steps li').forEach(li => li.classList.toggle('on', +li.dataset.i === i));
  $('#segHi').setAttribute('d', seg.length>1 ? smoothD(seg) : ''); const xs = seg.map(p=>p[0]), ys = seg.map(p=>p[1]); follow = false;
  fitBounds(Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys), 50); }

/* ---------- GPS ---------- */
let watchId = null, lastPos = null, lastRaw = null, lastPx = null, arrivedShown = false, rerouteAt = 0;
function setPill(cls, txt){ $('#gps').className = 'gps-pill ' + cls; $('#gpstxt').textContent = txt; }
function project(pts, p){ let best = {d:1e9, s:0, pt:pts[0]}, acc = 0;
  for (let i=1;i<pts.length;i++){ const a = pts[i-1], b = pts[i]; const vx=b[0]-a[0], vy=b[1]-a[1]; const L2 = vx*vx+vy*vy, L = Math.sqrt(L2); if (L2 < 1e-9) continue;
    const t = Math.max(0, Math.min(1, ((p[0]-a[0])*vx + (p[1]-a[1])*vy)/L2)); const q = [a[0]+t*vx, a[1]+t*vy];
    const d = Math.hypot(p[0]-q[0], p[1]-q[1]); if (d < best.d) best = {d, s:acc + t*L, pt:q}; acc += L; }
  return best; }
function startGPS(){
  if (!('geolocation' in navigator)){ setPill('warn', t('gpsNone')); return; }
  if (watchId !== null) return; setPill('', t('gpsSearch'));
  try { watchId = navigator.geolocation.watchPosition(onPos, err => setPill('warn', err.code===1 ? t('gpsDenied') : t('gpsNone')), {enableHighAccuracy:true, maximumAge:2000, timeout:20000}); }
  catch(e){ setPill('warn', t('gpsNone')); }
}
function onPos(pos){
  lastPos = pos; const {latitude, longitude, accuracy} = pos.coords; const raw = toMap(latitude, longitude); lastRaw = raw;
  const inside = raw[0] > -40 && raw[1] > 150 && raw[0] < MAP_W+40 && raw[1] < MAP_H+60;
  const wasOn = gpsOnSite; gpsOnSite = inside;
  const g = $('#me'); g.innerHTML = '';
  if (!inside){ setPill('warn', t('outside')); $('#locate').hidden = true; if (wasOn && !current) homeView(); return; }
  let p = raw;
  if (current){ const pr = project(current.pts, raw); if (pr.d/PXM < SNAP_M) p = pr.pt; }
  else { const n = nearestOnNet(raw); if (n.d/PXM < SNAP_M) p = n.q; }
  lastPx = p;
  el('circle', {cx:p[0], cy:p[1], r:Math.max(6, accuracy*PXM), fill:'var(--you)', 'fill-opacity':.12, stroke:'var(--you)', 'stroke-opacity':.35}, g);
  el('circle', {cx:p[0], cy:p[1], r:6.5, fill:'var(--you)', stroke:'#fff', 'stroke-width':2.2}, g);
  $('#locate').hidden = false; setPill('live', `Live · ±${Math.round(accuracy)} m`);
  if (!current){ if (!wasOn && !fixedStart && !location.hash.replace('#','')) homeView(); return; }
  const best = project(current.pts, raw); best.s *= current.total / (current.pts.reduce((s,p,i) => i ? s + Math.hypot(p[0]-current.pts[i-1][0], p[1]-current.pts[i-1][1]) : 0, 0) || 1); const off = best.d/PXM;
  // weit neben der Route: neu berechnen (höchstens alle 8 s)
  if (off > REROUTE_M && Date.now() - rerouteAt > 8000){ rerouteAt = Date.now(); routeView('gps', current.to, true); $('#note').textContent = t('rerouted'); return; }
  const remain = Math.max(0, (current.total - best.s)/PXM);
  $('#remain').textContent = t('remain', {d:fmtM(remain)});
  $('#note').textContent = off > SNAP_M ? t('offRoute', {d:fmtM(off)}) : t('toGoal');
  current.steps.forEach((s,i) => { const li = panel.querySelector(`li[data-i="${i}"]`); if (li) li.classList.toggle('done', current.scum[s.i1] < best.s - 5*PXM); });
  if (remain < ARRIVE_M && off < SNAP_M && !arrivedShown){ arrivedShown = true; $('#arrT').textContent = t('arrived'); $('#arrS').textContent = current.to===HOME ? exitName() : [nm(current.to), subOf(D[current.to])].filter(Boolean).join(' · '); $('#arrived').hidden = false; }
  if (follow){ fitTarget = null; const b = box(); if (vb.w > 260){ vb.w = 260; vb.h = 260*b.h/b.w; } vb.x = p[0]-vb.w/2; vb.y = p[1]-vb.h/2; clampVB(); applyVB(); }
}
$('#locate').onclick = () => { follow = true; if (lastPx){ const b = box(); const w = Math.min(vb.w, 260); vb = {x:lastPx[0]-w/2, y:lastPx[1]-w/b.w*b.h/2, w, h:w/b.w*b.h}; clampVB(); applyVB(); } };
$('#arrived').onclick = () => { $('#arrived').hidden = true; };

/* ---------- QR-Schilder ---------- */
const SIGNS = [
  {hash:'von-standort', mark:'S', title:'Einfahrt / Ausfahrt', text:'Scannen: Weg zur Warenannahme und zu allen Gebäuden'},
  {hash:'m50-standort', mark:'50', title:'Warenannahme', text:'Scannen: Weg zurück zur Ausfahrt'},
  {hash:'standort-m50', mark:'50', title:'Zur Warenannahme', text:'Für Lieferschein oder Einladung'},
];
function qrSVG(text){ if (!window.qrcode) return '<p>QR-Bibliothek wird geladen …</p>';
  const q = qrcode(0, 'M'); q.addData(text); q.make(); const n = q.getModuleCount(), m = 2; let d = '';
  for (let r=0;r<n;r++) for (let c=0;c<n;c++) if (q.isDark(r,c)) d += `M${c+m} ${r+m}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n+2*m} ${n+2*m}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`; }
function showQR(){ const inp = $('#qrBase'); if (!inp.value) inp.value = location.href.split('#')[0];
  const render = () => { const base = inp.value.trim().split('#')[0];
    $('#signs').innerHTML = SIGNS.map(s => `<div class="sign"><span class="t">${esc(s.title)}</span><div class="q">${qrSVG(base + '#' + s.hash)}</div><b>${esc(s.text)}</b><small>${esc(base + '#' + s.hash)}</small></div>`).join(''); };
  inp.oninput = render; render();
  if (!window.qrcode){ let n = 0; const t = setInterval(() => { if (window.qrcode || ++n > 40){ clearInterval(t); render(); } }, 250); } }

/* ---------- Navigation über den #-Anker ---------- */
function go(h){ location.hash = h; }
function route(){
  let h = decodeURIComponent(location.hash.replace('#','')).toLowerCase();
  const OLD = {'b-exit':'m50-standort', 'a-b':'standort-m50', 'a':'von-standort', 'c-exit':'', 'a-c':'', 'b':'m50-standort', 'c':''};
  if (h in OLD){ history.replaceState(null, '', '#' + OLD[h]); h = OLD[h]; }
  $('#pgQR').hidden = h !== 'qr'; if (h === 'qr') return showQR();
  let m;
  if ((m = h.match(/^von-([a-z0-9]+)$/)) && D[m[1]]){ fixedStart = m[1]; return homeView(); }
  if ((m = h.match(/^ziel-([a-z0-9]+)$/)) && D[m[1]]) return routeView(startId()==='gps' && lastRaw ? 'gps' : (fixedStart || HOME), m[1]);
  if ((m = h.match(/^([a-z0-9]+)-([a-z0-9]+)$/)) && (D[m[1]] || (m[1]==='gps' && lastRaw)) && D[m[2]] && m[1] !== m[2]){ if (m[1] !== 'gps') fixedStart = fixedStart || null; return routeView(m[1], m[2]); }
  if (h === '') fixedStart = null;
  homeView();
}
/* ---------- Sprachauswahl ---------- */
function applyLang(){
  document.documentElement.lang = LANG; $('#htitle').textContent = t('title');
  $('#langFlag').innerHTML = I18N.flags[LANG]; $('#langCode').textContent = LANG.toUpperCase(); $('#langBtn').setAttribute('aria-label', t('language'));
  $('#langMenu').innerHTML = I18N.langs.map(l => `<button role="menuitem" data-l="${l}" aria-current="${l===LANG}"><span class="flag">${I18N.flags[l]}</span>${I18N.native[l]}</button>`).join('');
  $('#langMenu').querySelectorAll('[data-l]').forEach(b => b.onclick = () => { LANG = b.dataset.l; try { localStorage.setItem('naviLang', LANG); } catch(e){}
    $('#langMenu').hidden = true; $('#langBtn').setAttribute('aria-expanded','false'); applyLang(); const keep = vb; route(); if (current) { vb = keep; applyVB(); } if (lastPos) onPos(lastPos); });
}
$('#langBtn').onclick = e => { e.stopPropagation(); const m = $('#langMenu'); m.hidden = !m.hidden; $('#langBtn').setAttribute('aria-expanded', String(!m.hidden)); };
document.addEventListener('click', e => { if (!e.target.closest('#langMenu,#langBtn')) { $('#langMenu').hidden = true; $('#langBtn').setAttribute('aria-expanded','false'); } });
applyLang();

applyVB();
window.addEventListener('hashchange', route);
requestAnimationFrame(route);
startGPS();
</script>
