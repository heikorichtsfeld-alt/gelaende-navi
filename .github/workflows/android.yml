name: Android-APK bauen
on:
  push:
    branches: [main]
    paths: ['index.html', 'android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Webseite in die App kopieren
        run: mkdir -p android/app/src/main/assets && cp index.html android/app/src/main/assets/index.html
      - name: APK bauen (unsigniert)
        working-directory: android
        run: gradle --no-daemon assembleRelease -PvCode=${{ github.run_number }}
      - name: APK in Branch apk-build ablegen
        run: |
          mkdir /tmp/out && cp android/app/build/outputs/apk/release/*.apk /tmp/out/app-release-unsigned.apk
          echo "${{ github.sha }} run ${{ github.run_number }}" > /tmp/out/BUILD.txt
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan apk-build && git rm -rfq . && cp /tmp/out/* . && git add app-release-unsigned.apk BUILD.txt
          git commit -qm "APK-Build ${{ github.run_number }}" && git push -f origin apk-build
